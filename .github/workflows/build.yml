name: Build mod

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft ${{ matrix.mcVersion }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcVersion: ['1.21.4', '1.21.8', '1.21.11']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      # gradle.properties contains a Windows-only local JDK override. The runner already
      # provides the required JDK through setup-java, so do not use that path in CI.
      - name: Remove local JDK override
        run: sed -i '/^[[:space:]]*org.gradle.java.home[[:space:]]*=/d' gradle.properties

      - name: Build target without tests
        run: ./gradlew --console=plain -PmcVersion="${{ matrix.mcVersion }}" assemble

      - name: Verify and stage runtime jar
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${{ matrix.mcVersion }}"
          jars=("build/${version}/libs/cestats-mc${version}-"*.jar)
          runtime_jars=()
          for jar in "${jars[@]}"; do
            [[ "$jar" == *-sources.jar ]] || runtime_jars+=("$jar")
          done

          if [[ "${#runtime_jars[@]}" -ne 1 ]]; then
            printf 'Expected exactly one runtime jar for Minecraft %s, found %s:\n' \
              "$version" "${#runtime_jars[@]}" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi

          mkdir -p dist
          cp "${runtime_jars[0]}" dist/

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: cestats-mod-${{ matrix.mcVersion }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 14
